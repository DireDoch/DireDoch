name: Update Profile Stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e .

      - name: Run tests
        run: |
          source .venv/bin/activate
          cd source
          python test_activity.py
          python test_token_check.py

      # The daily run died silently for a month on "401 Bad credentials" once the
      # 30-day PAT expired. Check it first, and warn a week before the next expiry.
      - name: Verify ACCESS_TOKEN
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          source .venv/bin/activate
          cd source
          python -c "from module.request_manager import check_token; check_token()"

      - name: Run stats updater
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          source .venv/bin/activate
          cd source
          python main.py

      - name: Commit updated assets
        run: |
          git config user.name "Anthony Boily"
          git config user.email "143445670+DireDoch@users.noreply.github.com"
          git add resources/profile.svg assets/snake.svg
          git diff --staged --quiet || git commit -m "chore: update profile stats [skip ci]"
          git push
